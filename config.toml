baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Ivan Oparin'

preserveTaxonomyNames = true
rssLimit = 10

[pagination]
  pagerSize = 10

# Code highlighting
pygmentsCodefences = true
pygmentsStyle = "native"

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/hugcis/hugo-astatine-theme"

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/:slug/"
  page = "/:slug/"

[[menu.main]]
  name = "About"
  url = "/"
  weight = 10

[[menu.main]]
  name = "CV"
  url = "/cv/"
  weight = 15

[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 20

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 30

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 40

[params]
  description = "Personal and research homepage of Ivan Oparin"
  authorName = "Ivan Oparin"
  blogrss = true

  [params.imgname]
    name = "img/profile.png"
    alt = "Profile picture"

[sitemap]
  filename = "sitemap.xml"
