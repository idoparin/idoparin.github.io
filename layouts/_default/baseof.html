<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    {{ partial "head.html" . }}
    {{/* Custom design overlay — see DESIGN_CHANGES.md */}}
    <link rel="stylesheet" href="{{ "css/site-custom.css" | relURL }}">
  </head>
  <body>
    <header>
        {{ partial "header.html" . }}
    </header>
    <main class="content h-card container mt-2 m-auto
                 leading-loose md:px-0 px-2 z-0"
          role="main">
    {{ block "main" . }}
    {{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
