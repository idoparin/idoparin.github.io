name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.md'
      - 'package-lock.json'
      - 'yarn.lock'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR Diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > diff.txt

      - name: Send to Gemini and Post Comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(cat diff.txt)
          
          if [ -z "$DIFF" ]; then
            echo "No diff found. Exiting."
            exit 0
          fi
          
          # Format the request payload for the Gemini API
          JSON_PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            '{
              contents: [{
                parts: [{
                  text: "You are a senior software engineer. Please review this code diff and point out any bugs, security risks, or logic issues. Keep it brief and skip the pleasantries.\n\n\($diff)"
                }]
              }]
            }')

          # Send the code to Gemini 2.5 Flash
          RESPONSE=$(curl -s -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$GEMINI_API_KEY")
          
          # Extract the text from the JSON response
          COMMENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          
          # Post the review back to your GitHub PR
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
